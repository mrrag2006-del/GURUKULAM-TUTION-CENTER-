<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gurukulam Tuition Centre Portal</title>
<style>
:root{--bg:#faf5e6;--card:#fffdf6;--ink:#1c2b22;--g:#14532d;--on:#fff;--gold:#b8860b;--mut:#66756b;--line:#e3dcc3;--bad:#b42318;--ok:#157f3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a13;--card:#16271d;--ink:#f1ead2;--g:#4ade80;--on:#0e1a13;--gold:#e0b44a;--mut:#9db0a3;--line:#2a4034;--bad:#f87171;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0e1a13;--card:#16271d;--ink:#f1ead2;--g:#4ade80;--on:#0e1a13;--gold:#e0b44a;--mut:#9db0a3;--line:#2a4034;--bad:#f87171;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--gold);background:var(--card)}
header img{height:46px}header h1{font-size:1.05rem;margin:0;color:var(--g);flex:1;line-height:1.2}header small{display:block;color:var(--mut);font-weight:400}
main{max-width:860px;margin:0 auto;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.portal{cursor:pointer;border-top:4px solid var(--gold);text-align:left;font:inherit;color:inherit}.portal h2{margin:.2em 0;color:var(--g)}.portal p{color:var(--mut);margin:0}
h3{color:var(--g);margin:.2em 0 .6em}label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0}
input,select,textarea{display:block;width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{background:var(--g);color:var(--on);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--g);border:1px solid var(--g)}button.red{background:var(--bad);color:#fff}button.sm{padding:4px 10px;font-size:.85rem}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--g)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--gold);font-size:.8rem}.ok{color:var(--ok)}.no{color:var(--bad)}.mut{color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--g);color:var(--on);padding:10px 18px;border-radius:99px;font-weight:600;z-index:9}.toast.bad{background:var(--bad);color:#fff}
@media print{header button,.noprint,.toast{display:none!important}}
</style></head><body><div id="app"></div>

const saveSt=()=>run(async()=>{const r=(F.reg||'').trim().toUpperCase(),o=S[r]||{};

 if(!o.code&&(F.code||'').length<4)return say('Set an access code (min 4 characters)',1);
 await db.doc('students/'+r).set({...o,reg:r,name:F.nm.trim(),cls:(F.cls||'').trim(),bt:(F.bt||'').trim(),fa:(F.fa||'').trim(),mo:(F.mo||'').trim(),ad:(F.ad||'').trim(),ph:F.ph||o.ph||'',marks:o.marks||{},code:F.code?await sha(r+F.code):o.code});

 if(mk<0||mk>mx)return say('Marks must be between 0 and '+mx,1);
 const marks=structuredClone(s.marks||{});(marks[ex]??={})[sb]=[mk,mx];await db.doc('students/'+F.ms).set({...s,marks});F.mk='';say('Marks saved')});

 return m}

const login=()=>run(async()=>{const r=(F.lr||'').trim().toUpperCase();if(!r||!F.lc)return say('Enter registration number and access code',1);
 const d=await db.doc('students/'+r).get(),o=d.exists&&d.data();if(!o||o.code!==await sha(r+F.lc))return say('Invalid registration number or access code',1);
 F.lc='';me=r;st=o;unsub.forEach(f=>f());unsub=[db.doc('students/'+r).onSnapshot(x=>{if(x.exists)st=x.data();render()}),db.collection('reeval').where('reg','==',r).onSnapshot(x=>{RS=x.docs.map(d=>d.data());render()})];render()});
const reqRe=()=>run(async()=>{const[ex,sb]=(F.rs||'').split('|');if(!sb||!(F.rr||'').trim())return say('Choose a subject and give a reason',1);
 if(RS.some(x=>x.exam==ex&&x.subject==sb&&x.status=='Pending'))return say('A request is already pending for this subject',1);
 await db.collection('reeval').add({reg:me,name:st.name,exam:ex,subject:sb,old:st.marks[ex][sb][0],reason:F.rr.trim(),status:'Pending',ts:Date.now()});F.rr='';say('Re-evaluation request submitted')});

function student(){const m=E('main');if(!db)return need(m);
 if(!me)return m.append(E('div',{class:'card',style:'max-width:420px;margin:auto'},E('h3',{},'Student login'),lab('Registration number',inp('lr',{autocomplete:'username'})),lab('Access code (given by your teacher)',inp('lc',{type:'password',autocomplete:'current-password'})),btn('View my report',login))),m;
 m.append(E('div',{class:'card'},av(st.ph),E('h3',{style:'margin:0'},st.name),E('div',{class:'mut'},'Reg. no. '+me),...[['Class',st.cls],['Tuition class',st.bt],['Father',st.fa],['Mother',st.mo],['Address',st.ad]].filter(x=>x[1]).map(x=>E('div',{class:'mut'},x[0]+': '+x[1])),E('div',{class:'noprint',style:'margin-top:8px;clear:both'},btn('Print',()=>window.print(),'alt sm'),' ',btn('Log out',()=>{unsub.forEach(f=>f());unsub=[];me=st=null;render()},'alt sm'))));
 const ex=Object.keys(st.marks||{}),opts=[];
 if(!ex.length)m.append(E('p',{class:'card mut'},'No marks have been published yet.'));
 ex.forEach(e=>{const o=st.marks[e],s=stats(o);Object.keys(o).forEach(k=>opts.push([e+'|'+k,e+' – '+k]));
 m.append(E('div',{class:'card'},E('h3',{},'Mark List – '+e),mlist(o),
 E('p',{},E('b',{},'Total: '+s.t+' / '+s.m+' · '+s.p.toFixed(1)+'% · Grade '+gr(s.p)+' · '),E('b',{class:s.pass?'ok':'no'},s.pass?'PASS':'NEEDS IMPROVEMENT'))))});
 if(opts.length)m.append(E('div',{class:'card noprint'},E('h3',{},'Request re-evaluation'),lab('Exam and subject',sel('rs',opts)),lab('Reason',E('textarea',{rows:3,oninput:e=>F.rr=e.target.value},F.rr||'')),btn('Submit request',reqRe)));
 if(RS.length)m.append(E('div',{class:'card noprint'},E('h3',{},'My requests'),tbl(['Exam','Subject','Status'],RS.sort((a,b)=>b.ts-a.ts).map(r=>[r.exam,r.subject,E('span',{class:'pill'},r.status+(r.newMark!=null?' → '+r.newMark:''))]))));
 m.append(E('p',{class:'mut'},'Grading: A+ ≥90, A ≥80, B+ ≥70, B ≥60, C ≥50, D ≥40, E <40. Pass needs ≥40% in every subject.'));return m}

render();
